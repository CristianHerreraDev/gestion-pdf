<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Documento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .pdf-container {
            width: 100%;
            max-width: 900px; /* Ancho máximo para mantener aspecto vertical en escritorio */
            height: 100vh;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <!-- Reemplaza 'documento.pdf' por el nombre o ruta de tu archivo PDF -->
        <iframe src="documento.pdf#view=FitH" title="Documento PDF"></iframe>
    </div>

</body>
</html>
